<html lang="en">
<head>
    <title>Web Forms 101</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

    <main>
        <form>
            <label>
                <span>Name:</span>
                <input type="text" name="name" placeholder="e.g. Mario">
            </label>
            <label>
                <span>Email:</span>
                <input type="email" name="email" placeholder="e.g. mario@gmail.com">
            </label>
            <label>
                <span>Password:</span>
                <input type="password" name="password">
            </label>
            <label>
                <span>About you:</span>
                <textarea name="about"></textarea>
            </label>
        </form>
    </main>

</body>
</html>
